<!--
  Block: data-table — searchable, filterable table with status pills and row actions.
  Replace: headers, rows; each <td> repeats its column in data-label for the
  stacked mobile cards; status pill data-status = in-stock | low | out.
  Hooks: --table-panel, --table-ink, --table-muted, --table-border, --table-accent.
-->
<section class="blk-table" aria-labelledby="table-title">
  <header class="blk-table__head"><h2 id="table-title">Inventory</h2>
    <p class="blk-table__count" role="status" aria-live="polite">1 item</p></header>
  <form class="blk-table__filters" role="search">
    <label class="blk-table__field"><span class="blk-table__label">Search</span>
      <input type="search" name="q" placeholder="SKU, item or category" autocomplete="off"></label>
    <label class="blk-table__field"><span class="blk-table__label">Status</span>
      <select name="status"><option value="all">All statuses</option>
        <option value="low">Low stock</option><option value="out">Out of stock</option>
      </select></label>
  </form>
  <table class="blk-table__table">
    <caption>Inventory items, stock on hand and reorder status</caption>
    <thead>
      <tr>
        <th scope="col">SKU</th><th scope="col">Item</th><th scope="col">Zone</th>
        <th scope="col" class="blk-table__num">Qty</th><th scope="col">Status</th>
        <th scope="col"><span class="blk-table__sr">Actions</span></th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td data-label="SKU">EB-1042</td><td data-label="Item">Espresso beans</td>
        <td data-label="Zone">A</td><td data-label="Qty" class="blk-table__num">18</td>
        <td data-label="Status"><span class="blk-table__pill" data-status="low">Low</span></td>
        <td data-label="Actions" class="blk-table__actions">
          <button class="blk-table__btn js-edit" type="button" aria-label="Edit EB-1042">Edit</button>
          <button class="blk-table__btn js-delete" type="button" aria-label="Delete EB-1042">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
</section>
<style>
  .blk-table {
    --table-panel: var(--panel, #12161d); --table-ink: var(--text, #e8e6e1);
    --table-muted: var(--muted, #9aa3ad); --table-border: var(--border, #232a35);
    --table-accent: var(--accent, #ff8a3d); container-type: inline-size;
    padding: clamp(0.9rem, 2vw, 1.25rem); color: var(--table-ink); background: var(--table-panel);
    border: 1px solid var(--table-border); border-radius: 14px;
  }
  .blk-table__head { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; }
  .blk-table__head h2 { margin: 0; font-size: 1.05rem; letter-spacing: -0.01em; }
  .blk-table__count, .blk-table__label, .blk-table__table th { color: var(--table-muted); font: 600 0.68rem/1.3 ui-monospace, Menlo, Consolas, monospace; letter-spacing: 0.08em; text-transform: uppercase; }
  .blk-table__count { margin: 0; letter-spacing: 0.02em; }
  .blk-table__filters { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0.9rem 0; }
  .blk-table__field { display: grid; gap: 0.3rem; flex: 1 1 12rem; }
  .blk-table__field input, .blk-table__field select {
    min-height: 2.4rem; padding: 0 0.65rem; color: var(--table-ink); background: transparent;
    border: 1px solid var(--table-border); border-radius: 8px; font: inherit; }
  .blk-table__field input:focus-visible, .blk-table__field select:focus-visible,
  .blk-table__btn:focus-visible { outline: 2px solid var(--table-accent); outline-offset: 2px; }
  .blk-table__table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
  .blk-table__table caption, .blk-table__sr {
    position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .blk-table__table th, .blk-table__table td { padding: 0.55rem 0.5rem; text-align: left; border-bottom: 1px solid var(--table-border); }
  .blk-table__table tbody tr:last-child td { border-bottom: 0; }
  .blk-table__num { text-align: right; font-variant-numeric: tabular-nums; }
  .blk-table__pill { display: inline-flex; padding: 0.15rem 0.55rem; border: 1px solid; border-radius: 999px; font: 600 0.72rem/1.5 ui-monospace, Menlo, Consolas, monospace; }
  .blk-table__pill[data-status="in-stock"] { color: #8beab4; border-color: #2f7d55; background: #14301f; }
  .blk-table__pill[data-status="low"] { color: #ffcf9a; border-color: #8a5a2a; background: #33220f; }
  .blk-table__pill[data-status="out"] { color: #ffa8a8; border-color: #8a3737; background: #33141a; }
  .blk-table__actions { display: flex; gap: 0.35rem; justify-content: flex-end; }
  .blk-table__btn { min-height: 2rem; padding: 0 0.55rem; color: var(--table-muted); background: transparent; border: 1px solid var(--table-border); border-radius: 7px; font: inherit; font-size: 0.78rem; cursor: pointer; }
  .blk-table__btn:hover { color: var(--table-ink); border-color: var(--table-accent); }
  @container (max-width: 700px) {
    .blk-table__table thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
    .blk-table__table, .blk-table__table tbody, .blk-table__table tr, .blk-table__table td { display: block; width: 100%; }
    .blk-table__table tr { margin-bottom: 0.6rem; padding: 0.45rem 0.7rem; border: 1px solid var(--table-border); border-radius: 10px; }
    .blk-table__table td { display: flex; justify-content: space-between; gap: 1rem; padding: 0.28rem 0; border: 0; text-align: left; }
    .blk-table__table td::before { content: attr(data-label); color: var(--table-muted); font: 600 0.68rem/1.4 ui-monospace, Menlo, Consolas, monospace; letter-spacing: 0.08em; text-transform: uppercase; }
    .blk-table__actions { justify-content: flex-end; padding-top: 0.4rem; }
  }
</style>
