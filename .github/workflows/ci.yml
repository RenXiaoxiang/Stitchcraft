name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install -e .

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate the stitch (modules, contracts, themes, skills, hooks)
        run: python -m stitchcraft validate --strict

      - name: Verify theme packages
        run: python -m stitchcraft themes verify

      - name: Verify skill packs
        run: python -m stitchcraft skills verify

      - name: Verify vendored browser libraries
        run: python -m stitchcraft libraries verify

      - name: Render the plan (smoke)
        run: python -m stitchcraft plan --mermaid-only > /dev/null

      - name: Dry-run the stitch planner
        run: python -m stitchcraft run --dry-run --out /tmp/stitch-dryrun

      - name: Headless studio smoke test (mock generation)
        run: python -m stitchcraft app --smoke-test --no-window

      - name: Check front-end JavaScript syntax
        run: |
          if [ -f app/web/app.js ]; then
            node --check app/web/app.js
          fi
          if [ -f docs/showcase.js ]; then
            node --check docs/showcase.js
          fi
