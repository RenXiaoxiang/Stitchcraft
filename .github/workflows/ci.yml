name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e .

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate the stitch
        run: stitch validate --strict

      - name: Render the plan (smoke)
        run: stitch plan --mermaid-only > /dev/null

      - name: Dry-run the stitch planner
        run: stitch run --dry-run --out /tmp/stitch-dryrun
