# Stitchcraft design-reference registry.
#
# DESIGN.md files are the Google Stitch-style design-system documents that tell
# an agent what a UI should look like: palette, type scale, components, layout,
# elevation, do/don't rules and responsive behaviour. The generator injects the
# selected reference into the build prompt; themes choose one with
# `design_reference = "<id>"` in theme.toml.
#
# Vendored files are unmodified MIT material under designs/vendor/<pack>/.

[meta]
version = "0.1.0"
description = "Curated DESIGN.md references from VoltAgent/awesome-design-md (MIT), one per theme family."

[[designs]]
id = "linear"
name = "Linear"
brand = "Linear"
source = "VoltAgent/awesome-design-md"
license = "MIT"
path = "designs/vendor/awesome-design-md/linear"
summary = "Near-black, technical product canvas with lavender-blue accent, charcoal panels and dense typography."
upstream = "design-md/linear.app/DESIGN.md"

[[designs]]
id = "notion"
name = "Notion"
brand = "Notion"
source = "VoltAgent/awesome-design-md"
license = "MIT"
path = "designs/vendor/awesome-design-md/notion"
summary = "Warm minimal productivity UI: generous whitespace, quiet typography and friendly document surfaces."
upstream = "design-md/notion/DESIGN.md"

