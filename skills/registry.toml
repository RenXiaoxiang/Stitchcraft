# Stitchcraft skill registry.
#
# Every skill here is baked into the repository so generations work offline.
# Upstream packs are vendored unmodified under skills/vendor/ with their
# original licenses; house skills are written for Stitchcraft under MIT.
#
# The desktop generator injects the selected theme's skills into the AI prompt
# (see src/stitchcraft/skills.py). `kind = "asset"` entries are vendored files
# (like the GSAP browser build) that are not prompt context.

[meta]
version = "0.2.0"
description = "Skills baked into Stitchcraft generations: Chrome Modern Web Guidance, landing-page design, official GSAP skills, web-animation skills and Stitchcraft house skills."

[[skills]]
id = "modern-web-guidance"
name = "Modern Web Guidance"
category = "web-platform"
source = "GoogleChrome/modern-web-guidance"
license = "Apache-2.0"
path = "skills/vendor/modern-web-guidance"
summary = "Chrome team guidance for modern, accessible, high-performance web UI, organised as reference guides."
stages = ["design", "build", "qa"]
enabled = true
budget_chars = 14000
kind = "skill"

